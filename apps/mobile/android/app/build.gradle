apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"

def hermesCompilerPackageRoot = file(
    "${rootProject.projectDir}/../../../node_modules/hermes-compiler/hermesc"
)
def hermesOsName = System.getProperty("os.name").toLowerCase()
def hermesCompilerBinary =
    hermesOsName.contains("windows")
        ? "win64-bin/hermesc.exe"
        : hermesOsName.contains("mac")
            ? "osx-bin/hermesc"
            : "linux64-bin/hermesc"

react {
    // npm workspaces hoist hermes-compiler to the repository root.
    // React Native 0.87's default lookup still targets the legacy
    // react-native/sdks/hermesc location, so resolve the compiler
    // explicitly from the installed package for each host OS.
    hermesCommand = file(
        "${hermesCompilerPackageRoot}/${hermesCompilerBinary}"
    ).absolutePath

    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.akshaerp.akshaconnect"
    defaultConfig {
        applicationId "com.akshaerp.akshaconnect"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 3
        versionName "0.3.0-v3"

        // Secure default: all non-debug variants are HTTPS-only.
        manifestPlaceholders = [usesCleartextTraffic: "false"]
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            // Local development may use localhost/LAN HTTP.
            manifestPlaceholders = [usesCleartextTraffic: "true"]
        }

        release {
            // Internal test release is deliberately signed with the debug key.
            // Production will use the AkshaConnect upload/release keystore.
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
